<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="128" fill="#0B1120"/>
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Stylized A Bridge Outer Curve -->
  <path d="M 120 380 C 140 250, 210 120, 256 120 C 302 120, 372 250, 392 380 C 330 310, 290 280, 256 280 C 222 280, 182 310, 120 380 Z" fill="url(#emeraldGrad)"/>

  <!-- Financial Chart Bars inside Bridge -->
  <rect x="210" y="240" width="20" height="50" rx="4" fill="url(#barGrad)" />
  <rect x="246" y="210" width="20" height="80" rx="4" fill="url(#barGrad)" />
  <rect x="282" y="180" width="20" height="110" rx="4" fill="url(#barGrad)" />

  <!-- Smooth Arch Sweep -->
  <path d="M 120 380 Q 256 280 392 380 Q 256 320 120 380 Z" fill="#059669" opacity="0.6"/>
</svg>